    state.sections.forEach(s => {
      counts[s.type] = (counts[s.type] || 0) + 1;
      const n = counts[s.type], d = s.data || {};
      Object.keys(d).forEach(k => {
        if (SKIP_FIELD.test(k)) return;
        const v = d[k];
        if (typeof v === 'string') { if (!v.startsWith('data:')) rows.push([s.type, n, k, v]); }
        else if (typeof v === 'number') rows.push([s.type, n, k, v]);
        else if (isStringArrayField(s.type, k, v)) v.forEach(x => rows.push([s.type, n, k, x]));
      });
    });
    if (rows.length === 1) { toast('Add some sections first — there is nothing to export yet.', 'err'); return; }
    downloadText('brochure-text.csv', '\uFEFF' + toCSV(rows), 'text/csv;charset=utf-8');
    toast('Downloaded brochure-text.csv ✓');
  }
  function importFieldsCSV(rows) {
    if (!rows.length) { toast('That file looks empty.', 'err'); return; }
    const first = rows[0].map(norm);
    let ix = { section: 0, n: 1, field: 2, value: 3 };
    let data = rows;
    if (first.includes('section') && first.includes('field')) {
      ix = { section: first.indexOf('section'), n: first.indexOf('n'), field: first.indexOf('field'), value: first.indexOf('value') };
      data = rows.slice(1);
    } else if (rows[0].length < 4) { toast('Expected 4 columns: section, n, field, value. Use “Download content as CSV” to get the right format.', 'err'); return; }
    if (!confirm(`Apply ${plural(data.length, 'row')} from this file to your brochure?\n\nText in matching fields will be overwritten. Missing sections will be added at the end. Images are untouched.`)) return;
    const touched = new Set(); let applied = 0, skipped = 0, created = 0;
    data.forEach(r => {
      const type = resolveType(r[ix.section]);
      const field = String(r[ix.field] == null ? '' : r[ix.field]).trim();
      const value = ix.value >= 0 && r[ix.value] != null ? String(r[ix.value]) : '';
      if (!type || type === 'gallery' || !field || SKIP_FIELD.test(field)) { skipped++; return; }
      const nn = ix.n >= 0 ? (parseInt(r[ix.n], 10) || 1) : 1;
      const secs = state.sections.filter(s => s.type === type);
      while (secs.length < nn) { const ns = newSection(type); state.sections.push(ns); secs.push(ns); created++; }
      const sec = secs[nn - 1], d = sec.data;
      if (!(field in d)) { skipped++; return; }
      if (Array.isArray(d[field])) {

        const key = sec.id + '|' + field;
        if (!touched.has(key)) { d[field] = []; touched.add(key); }
        if (value !== '') d[field].push(value);

      else { skipped++; return; }

    commit(true);
    toast(`Updated ${plural(applied, 'field')}` + (created ? `, added ${plural(created, 'section')}` : '') + (skipped ? ` · ${skipped} skipped` : '') + ' ✓');
  }

  function cleanTypo(t) {

    const o = {};
    const num = (v, lo, hi) => (typeof v === 'number' && isFinite(v) && v >= lo && v <= hi ? v : null);
    if (num(t.bodyScale, 0.5, 2) != null) o.bodyScale = t.bodyScale;

    if (fonts.includes(t.bodyFont)) o.bodyFont = t.bodyFont;

  function normalizeTemplate(raw, fallbackName) {

      sec.mergeNext = !!spec.mergeNext;
      if (['auto', 'light', 'band', 'dark'].includes(spec.look)) sec.look = spec.look;
      if (spec.collapsed === false) sec.collapsed = false;
      if (spec.background && typeof spec.background === 'object' && spec.background.image) sec.background = spec.background;
      if (spec.data && typeof spec.data === 'object') {

            else if (def.length && typeof def[0] === 'string') sec.data[k] = v.map(x => (typeof x === 'string' ? x : String(x == null ? '' : x)));
            else sec.data[k] = v;
          } else if (typeof def === 'string') {
            if (typeof v === 'string') sec.data[k] = v;
            else if (typeof v === 'number') sec.data[k] = String(v);
            else if (v && typeof v === 'object') sec.data[k] = v;       // image objects {src,...}

  function parseRange(str, max) {

      const a = +m[1], b = m[2] ? +m[2] : a;

    }

  }

        if (MISSPELL[lw]) { const rep = matchCase(w, MISSPELL[lw]); add('misspell', 'Spelling', 'err', i, i + w.length, rep, `Misspelt: “${w}” → “${rep}”.`, { safe: true }); continue; }

        if (known(w)) continue;
        const sug = suggest(w.replace(/’/g, "'"));
        add('spelling', 'Spelling', 'err', i, i + w.length, sug[0] ? matchCase(w, sug[0]) : null, `Unknown word “${w}”.`, { word: w, suggestions: sug.map(s => matchCase(w, s)), safe: false });
      }
    }
    return out;
  }

  /* ---------------- collecting every text field ---------------- */
  const SKIP_KEY = /^(icon|icons|image|photo|logo\d?|logos|bgImage|background|featureImage|certImage|certLogo|imagePosition|imageWidth|displayMode|theoryPct|practicalPct|id|look|layout|style|headStyle|highlight|type|_t|collapsed|enabled|mergeNext|numLabel)$/i;
  function collect() {
    const fields = [], arrays = [];
    const visit = (container, key, label, sec) => {
      const v = container[key];
      if (typeof v === 'string') { if (!v.startsWith('data:') && v.trim()) fields.push({ container, key, label, sec, val: v, kname: typeof key === 'number' ? label.k : key }); return; }
      if (Array.isArray(v)) {
        if (v.length && v.every(x => typeof x === 'string')) arrays.push({ arr: v, label, sec });
        v.forEach((x, i) => { if (typeof x === 'string') visit(v, i, { ...label, k: label.k }, sec); else if (x && typeof x === 'object') walkObj(x, label, sec); });
        return;
      }
      if (v && typeof v === 'object') walkObj(v, label, sec);
    };
    const walkObj = (o, label, sec) => { if ('src' in o || 'blurredSrc' in o) return; Object.keys(o).forEach(k => { if (SKIP_KEY.test(k)) return; visit(o, k, { text: label.text, k }, sec); }); };
    state.sections.filter(s => s.enabled).forEach(sec => walkObj(sec.data || {}, { text: TYPES[sec.type].label, k: '' }, sec));
    if (state.footerText) fields.push({ container: state, key: 'footerText', label: { text: 'Footer', k: 'text' }, sec: null, val: state.footerText, kname: 'footerText' });
    return { fields, arrays };
  }

  /* ---------------- full scan ---------------- */
  let ISSUES = [], lastTick = -1, filters = { Spelling: true, Grammar: true, Spacing: true, Punctuation: true, Style: true, Consistency: true }, showAll = false, ranOnce = false;
  const prettyKey = k => ({ paragraphs: 'paragraph', items: 'item', theoryItems: 'theory topic', handsonItems: 'practical item', bio: 'bio', intro: 'intro', note: 'note', heading: 'heading', text: 'text', title: 'title', desc: 'description', description: 'description', lines: 'line', requirements: 'requirement' }[k] || (k || 'text'));
  async function scanAll() {
    await loadDict();
    const { fields, arrays } = collect();
    const issues = []; let n = 0;
    fields.forEach(f => {
      scanString(f.val, f.kname).forEach(is => { is.field = f; is.id = 'i' + (n++); issues.push(is); });
    });
    /* British / American consistency */
    const all = fields.map(f => f.val).join(' \n ');
    const br = (all.match(BR_RE) || []).length + (all.match(/\bprogrammes?\b/gi) || []).length, am = (all.match(AM_RE) || []).length;
    if (br && am) {

      fields.forEach(f => { let m; re.lastIndex = 0; while ((m = re.exec(f.val))) { const rep = matchCase(m[0], map[m[0].toLowerCase()]); issues.push({ id: 'i' + (n++), rule: 'bre-ame', cat: 'Consistency', sev: 'info', start: m.index, end: m.index + m[0].length, orig: m[0], repl: rep, msg: `Mixed spelling: the rest of your text uses ${dominantBr ? 'British' : 'American'} spelling — “${rep}”.`, safe: false, field: f }); } });
    }

      const long = arr.map((s, i) => ({ s, i })).filter(x => x.s.trim().length > 25);
      if (long.length < 3) return;
      const ends = long.filter(x => /[.!?]$/.test(x.s.trim())).length;
      if (ends === 0 || ends === long.length) return;
      const addDot = ends >= long.length / 2;
      long.forEach(x => { const has = /[.!?]$/.test(x.s.trim()); if (addDot === has) return; const f = fields.find(ff => ff.container === arr && ff.key === x.i); if (!f) return; const end = x.s.length; issues.push({ id: 'i' + (n++), rule: 'list-punct', cat: 'Consistency', sev: 'info', start: addDot ? end : end - 1, end, orig: addDot ? '' : x.s.slice(-1), repl: addDot ? '.' : '', msg: addDot ? 'Most items in this list end with a full stop — add one here.' : 'Most items in this list have no full stop — remove it here.', safe: false, field: f }); });
    });

    fields.forEach(f => { if (/^(paragraphs|text|intro|note|bio|desc|description|body)$/.test(f.kname) && f.val.trim().length >= 60 && /[A-Za-z0-9)]$/.test(f.val.trim()) && !/\n/.test(f.val.trim())) issues.push({ id: 'i' + (n++), rule: 'no-final-stop', cat: 'Punctuation', sev: 'info', start: f.val.length, end: f.val.length, orig: '', repl: '.', msg: 'This paragraph does not end with a full stop.', safe: false, field: f }); });

    ISSUES = issues.filter(is => !IGNORED.has(is.rule + '|' + String(is.orig).toLowerCase()));
    const order = new Map(state.sections.map((s, i) => [s.id, i]));
    ISSUES.sort((a, b) => (a.field.sec ? order.get(a.field.sec.id) : 999) - (b.field.sec ? order.get(b.field.sec.id) : 999) || a.start - b.start);
    lastTick = state._t || 0; ranOnce = true;

  }

  /* ---------------- applying fixes ---------------- */
  function applyToField(f, list) {
    // list: issues for the same field with repl !== null, sorted desc, non-overlapping
    let s = f.container[f.key];
    list.sort((a, b) => b.start - a.start);

  }

  /* ---------------- panel UI ---------------- */
  const CATS = [['Spelling', '🔤'], ['Grammar', '📖'], ['Spacing', '␣'], ['Punctuation', '❝'], ['Style', '✨'], ['Consistency', '⚖']];

  }
  function goTo(is) {

    });
  }
  function render() {
    const p = $('#panelProof'); if (!p) return;
    p.innerHTML = '';
    const vis = ISSUES.filter(is => filters[is.cat] !== false);
    const safe = ISSUES.filter(is => is.safe && is.repl !== null && filters[is.cat] !== false);
    const counts = {}; ISSUES.forEach(is => { counts[is.cat] = (counts[is.cat] || 0) + 1; });
    const head = h('div', { class: 'ex-card' }, [
      h('h4', {}, '✍ Proofread'),
      h('p', { class: 'ex-sub' }, 'Spelling, grammar, spacing and punctuation across every page. Works offline — your text never leaves this browser unless you use the optional online check.'),
      h('div', { class: 'ex-row' }, [
        h('button', { class: 'ex-btn primary', type: 'button', onclick: async () => { await scanAll(); render(); toast(ISSUES.length ? `${plural(ISSUES.length, 'issue')} found` : 'No issues found 🎉'); } }, ranOnce ? '↻ Re-check' : '▶ Run proofread'),
        h('button', { class: 'ex-btn', type: 'button', disabled: safe.length ? null : 'disabled', title: 'Fixes spacing, punctuation, repeated words, a/an, common typos — not spelling guesses', onclick: () => fixIssues(safe, 'Fixed') }, `✔ Fix all safe (${safe.length})`)
      ]),
      h('div', { class: 'ex-chips' }, CATS.map(([c, ic]) => h('span', { class: 'ex-chipbtn' + (filters[c] !== false ? ' on' : ''), style: 'cursor:pointer', title: 'Show / hide', onclick: () => { filters[c] = filters[c] === false; render(); } }, `${ic} ${c} ${counts[c] || 0}`)))
    ]);

    p.appendChild(head);
    if (ranOnce && !vis.length) p.appendChild(h('div', { class: 'ex-note ok' }, ISSUES.length ? 'Nothing in the categories you have switched on.' : '🎉 No issues found. Your text reads clean.'));
    const list = showAll ? vis : vis.slice(0, 80);
    list.forEach(is => {
      const row = h('div', { class: 'ex-issue pf ' + (is.sev === 'err' ? 'err' : is.sev === 'warn' ? 'warn' : '') });
      const tx = h('div', { class: 'tx' });
      tx.appendChild(h('div', {}, [h('span', { class: 'pf-tag' }, is.cat), ' ', is.msg]));
      const c = h('div', { class: 'pf-ctx' }); c.innerHTML = ctxHtml(is); tx.appendChild(c);
      tx.appendChild(h('small', {}, `${is.field.label.text} › ${prettyKey(is.field.kname)}`));
      const act = h('div', { class: 'pf-act' });
      const sugg = is.suggestions && is.suggestions.length ? is.suggestions : (is.repl !== null && is.repl !== undefined ? [is.repl] : []);
      const BL = { 'double-space': 'One space', 'lead-space': 'Remove space', 'trail-space': 'Remove space', 'space-before-punct': 'Remove space', 'no-space-comma': 'Add space', 'no-space-period': 'Add space', 'no-space-semicolon': 'Add space', 'space-in-bracket': 'Remove space', 'no-space-bracket': 'Add space', 'repeat-word': 'Remove repeat', 'repeat-punct': 'Remove repeat', 'double-period': 'Fix', 'ellipsis': 'Fix', 'dash': 'Use dash', 'apostrophe': 'Use ’', 'list-punct': is.repl === '.' ? 'Add full stop' : 'Remove full stop', 'no-final-stop': 'Add full stop' };
      sugg.slice(0, 3).forEach((sg, si) => act.appendChild(h('button', { class: 'ex-btn sm primary', type: 'button', title: 'Apply this fix → ' + (sg === '' ? '(remove)' : sg), onclick: () => fixIssues([Object.assign({}, is, { repl: sg })], 'Fixed') }, (si === 0 && BL[is.rule]) || (sg === '' ? 'Remove' : sg.length > 22 ? sg.slice(0, 20) + '…' : sg))));
      act.appendChild(h('button', { class: 'ex-btn sm', type: 'button', onclick: () => goTo(is) }, 'Go →'));
      if (is.rule === 'spelling') act.appendChild(h('button', { class: 'ex-btn sm', type: 'button', title: 'Never flag this word again', onclick: () => { CUSTOM.add(is.word.toLowerCase()); lsSet('exProofDict', [...CUSTOM]); scanAll().then(render); toast(`“${is.word}” added to your dictionary`); } }, '＋ Dictionary'));
      act.appendChild(h('button', { class: 'ex-btn sm', type: 'button', title: 'Ignore this', onclick: () => { IGNORED.add(is.rule + '|' + String(is.orig).toLowerCase()); lsSet('exProofIgnore', [...IGNORED]); ISSUES = ISSUES.filter(x => x !== is); render(); } }, 'Ignore'));
      tx.appendChild(act); row.appendChild(tx); p.appendChild(row);
    });
    if (vis.length > list.length) p.appendChild(h('button', { class: 'ex-btn', type: 'button', onclick: () => { showAll = true; render(); } }, `Show all ${vis.length}`));
    // footer: dictionary / ignore management + online check
    const foot = h('div', { class: 'ex-card' }, [
      h('h5', {}, 'More'),
      h('div', { class: 'ex-row' }, [
        h('button', { class: 'ex-btn', type: 'button', onclick: deepCheck, title: 'Uses the free LanguageTool service for deeper grammar checking' }, '🌐 Deep grammar check (online)'),
        h('button', { class: 'ex-btn sm', type: 'button', disabled: CUSTOM.size ? null : 'disabled', onclick: () => { if (!confirm(`Remove all ${CUSTOM.size} words from your custom dictionary?`)) return; CUSTOM.clear(); lsSet('exProofDict', []); scanAll().then(render); } }, `Custom dictionary (${CUSTOM.size}) — clear`),
        h('button', { class: 'ex-btn sm', type: 'button', disabled: IGNORED.size ? null : 'disabled', onclick: () => { IGNORED.clear(); lsSet('exProofIgnore', []); scanAll().then(render); } }, `Ignored (${IGNORED.size}) — reset`)
      ]),
      h('div', { class: 'ex-hint' }, 'The deep check sends your brochure text to languagetool.org (free public service, about 20 requests a minute). Everything else here stays on your device.')
    ]);
    p.appendChild(foot);
    const tab = $('.ex-tab[data-tab=proof]'); if (tab) { const n = ISSUES.filter(i => i.sev !== 'info').length; tab.textContent = n ? `✍ Proof (${n})` : '✍ Proof'; }
  }

  /* ---------------- optional online deep check (LanguageTool) ---------------- */
  async function deepCheck() {
    if (!confirm('Deep grammar check\n\nThis sends the text of your brochure to the free LanguageTool service (languagetool.org) to look for grammar and style problems.\n\nContinue?')) return;
    await loadDict();
    const { fields } = collect(); let added = 0, n = 5000;
    try {
      let chunk = [], len = 0; const chunks = [];
      fields.forEach(f => { if (len + f.val.length + 1 > 14000 && chunk.length) { chunks.push(chunk); chunk = []; len = 0; } chunk.push(f); len += f.val.length + 1; });
      if (chunk.length) chunks.push(chunk);
      for (let ci = 0; ci < chunks.length; ci++) {
        const ch = chunks[ci]; let text = '', map = [];
        ch.forEach(f => { map.push({ f, s: text.length, e: text.length + f.val.length }); text += f.val + '\n'; });
        const body = new URLSearchParams({ text, language: 'en-GB', enabledOnly: 'false' });
        const r = await fetch('https://api.languagetool.org/v2/check', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
        if (!r.ok) throw new Error('Service returned ' + r.status);
        const j = await r.json();
        (j.matches || []).forEach(m => {
          const seg = map.find(x => m.offset >= x.s && m.offset < x.e); if (!seg) return;
          const st = m.offset - seg.s, en = Math.min(seg.f.val.length, st + m.length);
          if (['TYPOS', 'MORFOLOGIK_RULE_EN_GB', 'WHITESPACE_RULE', 'UPPERCASE_SENTENCE_START'].includes(m.rule.id) && ISSUES.some(x => x.field === seg.f && x.start <= st && x.end >= en)) return;
          if (ISSUES.some(x => x.field === seg.f && x.start === st && x.end === en)) return;
          const reps = (m.replacements || []).slice(0, 3).map(x => x.value);
          ISSUES.push({ id: 'i' + (n++), rule: 'lt-' + m.rule.id, cat: m.rule.issueType === 'misspelling' ? 'Spelling' : /style|typographical/.test(m.rule.issueType) ? 'Style' : 'Grammar', sev: 'warn', start: st, end: en, orig: seg.f.val.slice(st, en), repl: reps[0] !== undefined ? reps[0] : null, suggestions: reps, msg: (m.message || 'Possible issue') + ' (LanguageTool)', safe: false, field: seg.f }); added++;
        });

      toast(added ? `Deep check added ${plural(added, 'suggestion')}` : 'Deep check found nothing more ✓'); render();
    } catch (e) { toast('Online check not available: ' + (e && e.message ? e.message : e) + '. The offline checks still work.', 'err'); }
  }

  /* ---------------- tab + panel wiring ---------------- */
  $('#exTabs').appendChild(h('button', { type: 'button', class: 'ex-tab', 'data-tab': 'proof', title: 'Spelling, grammar and spacing check' }, '✍ Proof'));
  $('#sidebar').appendChild(h('div', { id: 'panelProof', class: 'ex-panel' }));
  $$('.ex-tab:not([data-tab=proof])').forEach(b => b.addEventListener('click', () => { $('#panelProof').classList.remove('show'); }));

  renderSidebar = function () { const r = _rs7.apply(this, arguments); $$('#sectionList input[type=text], #sectionList textarea').forEach(i => { i.spellcheck = true; i.setAttribute('lang', 'en-GB'); }); return r; };

  const EX_HELP7 = `
    <h2>16. Proofread</h2>
    <ul>
      <li>Open the <b>✍ Proof</b> tab. It checks every page for <b>spelling</b> (160,000-word dictionary, British and American spellings both accepted), <b>grammar</b> (a/an, subject–verb, repeated words, then/than, its/it’s…), <b>spacing</b> (double spaces, space before punctuation, missing spaces, ₹ / % / AM-PM / units), <b>punctuation</b> and <b>consistency</b> (British vs American spelling mixed, lists where only some items end with a full stop).</li>
      <li>Click a suggestion to fix that one issue, <b>Go →</b> to jump to the field, <b>＋ Dictionary</b> to teach it a word (names, tools), or <b>Ignore</b>.</li>
      <li><b>✔ Fix all safe</b> applies only mechanical fixes (spacing, punctuation, repeated words, a/an, known typos). Spelling guesses are never applied automatically. Undo reverses it.</li>

      <li><b>Deep grammar check (online)</b> is optional and sends your text to languagetool.org.</li>
    </ul>`;
  const _oh7 = openHelpModal;
  openHelpModal = function () { const r = _oh7.apply(this, arguments); const b = $('#helpModalBody'); if (b && !b.dataset.exHelp7) { b.insertAdjacentHTML('beforeend', EX_HELP7); b.dataset.exHelp7 = '1'; } return r; };
  window.__proof = { scanString, known, scanAll: async () => { await scanAll(); return ISSUES; }, loadDict };
})();


/* =========================================================
   Boot
   ========================================================= */
(function boot() {
  if (!loadPersisted() || !state.sections) {

  }

  initSidebarResize();
  initPreviewSelection();
  renderSidebar();
  renderPreview();
})();

</script>
