<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brochure Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ed-bg:#eef0f3;
  --ed-panel:#ffffff;
  --ed-border:#dde1e7;
  --ed-ink:#1c1f26;
  --ed-muted:#6b7280;
  --ed-accent:#0d9488;
  --ed-accent-dark:#0f766e;
  --ed-danger:#dc2626;
  --accent:#c0392b;
  --ink:#0f2a3e;
  --paper:#fbfaf7;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--ed-bg);
  color:var(--ed-ink);
  height:100vh;
  overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100vh;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;
  background:#14161c;color:#fff;
  padding:10px 18px;
  flex-shrink:0;
  border-bottom:3px solid var(--ed-accent);
  flex-wrap:wrap;
}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:.3px;margin-right:8px;white-space:nowrap;}
.topbar .brand span{color:var(--ed-accent);}
.tb-group{display:flex;align-items:center;gap:6px;font-size:12px;color:#c7c9d1;}
.tb-group label{display:flex;align-items:center;gap:6px;}
.tb-group input[type=color]{width:28px;height:28px;border:none;border-radius:6px;padding:0;background:none;cursor:pointer;}
.tb-group input[type=text]{background:#20232b;border:1px solid #343945;color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;width:150px;}
.tb-spacer{flex:1;}
select.tb-select{background:#20232b;color:#fff;border:1px solid #343945;border-radius:6px;padding:6px 8px;font-size:12px;}
.btn{
  border:none;border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn-primary{background:var(--ed-accent);color:#fff;}
.btn-primary:hover{background:var(--ed-accent-dark);}
.btn-ghost{background:#20232b;color:#fff;}
.btn-ghost:hover{background:#2b2f3a;}
.btn-sm{padding:4px 8px;font-size:11px;border-radius:5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Workspace ---------- */
.workspace{flex:1;display:flex;overflow:hidden;}
#sidebar{
  width:400px;min-width:260px;max-width:800px;flex-shrink:0;background:var(--ed-panel);
  overflow-y:auto;padding:14px;
}
#sidebarResizer{
  width:6px;flex-shrink:0;cursor:col-resize;background:var(--ed-border);position:relative;
}
#sidebarResizer:hover,#sidebarResizer.dragging{background:var(--ed-accent);}
#sidebarResizer::after{
  content:"";position:absolute;top:50%;left:50%;width:2px;height:26px;
  transform:translate(-50%,-50%);background:rgba(255,255,255,.6);border-radius:2px;
}
#addBar{
  display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;background:var(--ed-panel);
  padding-bottom:10px;border-bottom:1px solid var(--ed-border);z-index:5;
}
#addBar select{flex:1;border:1px solid var(--ed-border);border-radius:7px;padding:8px;font-size:12.5px;}

.insert-line{height:14px;position:relative;display:flex;align-items:center;justify-content:center;}
.insert-line .insert-btn{
  opacity:0;transition:opacity .12s;border:none;background:var(--ed-accent);color:#fff;
  width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.insert-line::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ed-border);
  opacity:0;transition:opacity .12s;
}
.insert-line:hover .insert-btn,.insert-line:hover::before{opacity:1;}
.insert-line .insert-btn:hover{background:var(--ed-accent-dark);}

.section-card{
  border:1px solid var(--ed-border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff;
}
.section-card.disabled{opacity:.55;}
.sc-head{
  display:flex;align-items:center;gap:8px;padding:9px 10px;background:#f7f8fa;cursor:pointer;user-select:none;
}
.sc-head .sc-tag{
  font-size:9.5px;font-weight:700;letter-spacing:.4px;color:var(--ed-accent-dark);background:#e6f6f4;
  padding:2px 6px;border-radius:4px;text-transform:uppercase;flex-shrink:0;
}
.sc-head .sc-title{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc-actions{display:flex;align-items:center;gap:2px;}
.icon-btn{
  border:none;background:none;cursor:pointer;color:var(--ed-muted);padding:4px 5px;border-radius:5px;font-size:13px;line-height:1;
}
.icon-btn:hover{background:#e9ebef;color:var(--ed-ink);}
.icon-btn.danger:hover{background:#fde3e3;color:var(--ed-danger);}
.icon-btn.merge-active{color:var(--ed-accent-dark);background:#e6f6f4;}
.icon-btn:disabled{opacity:.28;cursor:not-allowed;}
.icon-btn:disabled:hover{background:none;color:var(--ed-muted);}
.switch{position:relative;width:30px;height:17px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:#c7cbd3;border-radius:20px;transition:.15s;}
.switch .track:before{content:"";position:absolute;width:13px;height:13px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .track{background:var(--ed-accent);}
.switch input:checked + .track:before{transform:translateX(13px);}
.sc-body{padding:12px 12px 14px;border-top:1px solid var(--ed-border);}

.field{display:block;margin-bottom:10px;}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--ed-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.field input[type=text],.field input[type=number],.field textarea{
  width:100%;border:1px solid var(--ed-border);border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;
  background:#fff;color:var(--ed-ink);
}
.field textarea{resize:vertical;min-height:54px;line-height:1.4;}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ed-accent);box-shadow:0 0 0 3px rgba(13,148,136,.12);}
.field-row{display:flex;gap:8px;}
.field-row .field{flex:1;}

.list-editor .list-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start;}
.list-editor .list-row textarea,.list-editor .list-row input{flex:1;}
.add-link{
  background:none;border:1px dashed var(--ed-border);color:var(--ed-accent-dark);border-radius:6px;
  padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;width:100%;text-align:center;
}
.add-link:hover{background:#f0faf9;border-color:var(--ed-accent);}

.img-drop{display:flex;align-items:center;gap:10px;}
.img-drop .thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#f0f1f3;border:1px solid var(--ed-border);flex-shrink:0;}
.img-drop input[type=file]{font-size:11.5px;flex:1;}

.item-card{border:1px solid var(--ed-border);border-radius:8px;padding:10px;margin-bottom:8px;background:#fafbfc;position:relative;}
.item-card .item-toolbar{display:flex;justify-content:flex-end;gap:2px;margin-bottom:6px;}

.divider{border:none;border-top:1px solid var(--ed-border);margin:12px 0;}
.hint{font-size:11px;color:var(--ed-muted);margin-top:-4px;margin-bottom:8px;}

/* ---------- Preview ---------- */
#previewWrap{flex:1;overflow:auto;background:#d9dce2;padding:36px;}
#pages{margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px;transform-origin:top center;width:794px;}

.page{
  width:794px;min-height:1123px;background:var(--paper);box-shadow:0 6px 24px rgba(0,0,0,.22);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  font-family:'Inter',sans-serif;color:#232323;flex-shrink:0;
}
.page-head{
  background:var(--ink);color:#fff;padding:16px 40px;flex-shrink:0;
  border-bottom:5px solid var(--accent);
}
.page-head .eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;}
.page-body{padding:34px 40px 20px;flex:1;}
.section-hit{cursor:pointer;border-radius:6px;transition:box-shadow .15s;}
.section-hit:hover{box-shadow:inset 0 0 0 2px rgba(13,148,136,.35);}
.page-body.no-pad{padding:0;}
.page-body.no-pad .section-hit{border-radius:0;}
.page-body.no-pad .section-hit:hover{box-shadow:inset 0 0 0 3px rgba(13,148,136,.45);}
/* .stretch turns page-body into a column flex container so a full-bleed
   image or split layout gets a genuine, definite height to fill (plain
   percentage heights don't reliably resolve through a block-level parent). */
.page-body.stretch{display:flex;flex-direction:column;}
.page-body.stretch > .section-hit{flex:1;min-height:0;display:flex;flex-direction:column;}
.page-body.stretch > .section-hit > .bgfx-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
.section-card.selected{border-color:var(--ed-accent);box-shadow:0 0 0 3px rgba(13,148,136,.18);}
.page-foot{
  display:flex;justify-content:space-between;align-items:center;padding:10px 40px 16px;
  font-size:9.5px;color:#9a9a9a;letter-spacing:.3px;border-top:1px solid #eee;flex-shrink:0;margin-top:auto;
}
.page-foot b{color:var(--accent);}

.doc-h2{font-family:'Source Serif 4',serif;font-size:24px;font-weight:700;color:var(--ink);margin:0 0 14px;}
.doc-p{font-size:13.5px;line-height:1.65;color:#333;margin:0 0 10px;}
.doc-ul{margin:0 0 4px;padding-left:20px;}
.doc-ul li{font-size:13.5px;line-height:1.6;color:#333;margin-bottom:6px;}
.doc-ul.check li{list-style:none;position:relative;padding-left:22px;}
.doc-ul.check li:before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700;}

table.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px;}
table.doc-table th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
table.doc-table td{padding:9px 12px;border-bottom:1px solid #e6e6e6;color:#333;}
table.doc-table tr:nth-child(even) td{background:#f7f7f5;}

.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.person-card{display:flex;gap:10px;align-items:flex-start;}
.person-card .pc-photo{width:56px;height:56px;border-radius:50%;background:#e5e5e5;background-size:cover;background-position:center;flex-shrink:0;}
.person-card .pc-name{font-weight:700;font-size:13.5px;color:var(--ink);}
.person-card .pc-role{font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:4px;}
.person-card .pc-bio{font-size:11.5px;color:#555;line-height:1.5;}

.tool-card{border:1px solid #e6e6e6;border-radius:8px;padding:12px 14px;}
.tool-card .tc-cat{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:4px;}
.tool-card .tc-tools{margin-bottom:6px;}
.chip{display:inline-block;background:#eef2f4;color:var(--ink);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:10px;margin:0 4px 4px 0;}
.tool-card .tc-desc{font-size:11.5px;color:#555;line-height:1.5;}

.stat-row{display:flex;gap:14px;}
.stat-box{
  flex:1;border:1px solid #e6e6e6;border-radius:10px;padding:14px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:72px;
}
.stat-box .sv{
  font-family:'Source Serif 4',serif;font-size:18px;font-weight:700;color:var(--accent);
  line-height:1.3;word-break:break-word;max-width:100%;
}
.stat-box .sv.sv-md{font-size:15.5px;}
.stat-box .sv.sv-sm{font-size:13px;letter-spacing:.1px;}
.stat-box .sl{font-size:10.5px;color:#666;text-transform:uppercase;letter-spacing:.3px;}

.badge-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.badge{border:2px solid var(--accent);border-radius:50%;width:88px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;}
.badge .bv{font-weight:700;font-size:15px;color:var(--ink);line-height:1.1;}
.badge .bl{font-size:8px;color:#666;line-height:1.2;margin-top:2px;}
.logo-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.logo-row img{height:44px;max-width:120px;object-fit:contain;}

.module-block{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed #ddd;}
.module-block:last-child{border-bottom:none;}
.module-block .mb-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.module-block .mb-title h3{font-size:14.5px;color:var(--ink);margin:0;font-weight:700;}
.module-block .mb-title span{font-size:11px;color:var(--accent);font-weight:700;}
.module-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.module-cols h4{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#888;margin:0 0 6px;}

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gallery-grid .gallery-photo{width:100%;height:110px;border-radius:6px;background:#eee;background-size:cover;background-position:center;}

.contact-card{border:1px solid #e6e6e6;border-radius:8px;padding:12px 14px;}
.contact-card .cc-org{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:4px;}
.contact-card .cc-line{font-size:12px;color:#555;}

/* ---------- Cover ---------- */
.cover-page{position:relative;color:#fff;background:linear-gradient(160deg,var(--ink) 0%,#000 120%);min-height:1123px;display:flex;flex-direction:column;}
.cover-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;}
.cover-overlay{position:relative;flex:1;display:flex;flex-direction:column;padding:40px 46px;z-index:2;}
.cover-logos{display:flex;gap:20px;align-items:center;margin-bottom:auto;}
.cover-logos img{height:46px;max-width:130px;object-fit:contain;background:#fff;border-radius:6px;padding:4px;}
.cover-kicker{font-size:13px;letter-spacing:2px;font-weight:700;color:#e8e8e8;margin-bottom:8px;text-transform:uppercase;}
.cover-title{font-family:'Source Serif 4',serif;font-size:40px;font-weight:700;line-height:1.15;color:#fff;margin:0;}
.cover-title.accent{color:var(--accent);}
.cover-collab{margin-top:26px;background:var(--accent);display:inline-block;padding:10px 18px;font-size:12.5px;font-weight:600;border-radius:4px;}

/* certificate mock */
.cert-wrap{border:8px solid #1c1c1c;border-radius:4px;padding:6px;background:#1c1c1c;margin-top:10px;}
.cert-inner{border:3px solid var(--accent);background:#fff;padding:26px 30px;text-align:center;}
.cert-inner img{height:34px;object-fit:contain;margin-bottom:6px;}
.cert-title{font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--accent);margin-bottom:14px;}
.cert-name{font-family:'Source Serif 4',serif;font-size:22px;font-weight:700;color:var(--ink);margin:6px 0;}
.cert-prog{font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;color:var(--ink);margin:10px 0;line-height:1.3;}
.cert-sign-row{display:flex;justify-content:space-around;margin-top:22px;}
.cert-sign{font-size:10.5px;text-align:center;}
.cert-sign b{display:block;font-size:11.5px;border-top:1px solid #999;padding-top:4px;margin-top:22px;}

.doc-divider{border:none;border-top:1px solid #ddd;margin:14px 0 18px;}
.doc-ol{margin:0 0 4px;padding-left:20px;}
.doc-ol li{font-size:12.5px;line-height:1.55;color:#333;margin-bottom:5px;}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
.cards-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.cards-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px;}
.fact-card{border:1px solid #e6e6e6;border-radius:8px;padding:9px 12px;font-size:11.5px;line-height:1.45;color:#333;background:#fafbfc;}
.fc-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;}
.mini-card{border:1px solid #e6e6e6;border-radius:8px;padding:12px 10px;text-align:center;}
.mini-card img{width:48px;height:48px;object-fit:contain;margin:0 auto 8px;display:block;}
.mini-card h5{font-size:11.5px;margin:0 0 4px;color:var(--ink);}
.mini-card p{font-size:10px;color:#666;margin:0;line-height:1.4;}
.tool-icon{width:32px;height:32px;object-fit:contain;margin-right:6px;vertical-align:middle;border-radius:4px;}
.stack-block{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #eee;}
.stack-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.stack-image{width:150px;height:110px;flex-shrink:0;border-radius:8px;background-size:cover;background-position:center;background-color:#eef0f2;}
.stack-text{flex:1;min-width:0;}
.stack-text h3{font-family:'Source Serif 4',serif;font-size:17px;font-weight:700;color:var(--ink);margin:0 0 6px;}
.cert-upload-wrap{width:100%;max-height:640px;display:flex;justify-content:center;margin-top:8px;}
.cert-upload-wrap img{max-width:100%;max-height:640px;object-fit:contain;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.18);}

/* ---- Optional per-section background image (pre-blurred, see applyBlurToImage) ----
   Two "scopes":
   - bgfx-scope-page: breaks out of the page-body's own padding via negative
     margins so the image reaches the true page edges, then re-applies the
     same padding to .bgfx-content so text sits exactly where it normally
     would. Used for a section on its own page.
   - bgfx-scope-block: same idea but only breaks out horizontally, since a
     merged/stacked block shares its page-body with sibling blocks and must
     not disturb their vertical flow. */
.bgfx-wrap{position:relative;}
.bgfx-wrap.bgfx-scope-page{margin:-34px -40px -20px -40px;}
.bgfx-wrap.bgfx-scope-page > .bgfx-content{padding:34px 40px 20px;}
.bgfx-wrap.bgfx-scope-block{margin:0 -40px;}
.bgfx-wrap.bgfx-scope-block > .bgfx-content{padding:0 40px;}
.bgfx-content{position:relative;z-index:1;flex:0 0 auto;}
.bgfx-layer{position:absolute;overflow:hidden;pointer-events:none;}
.bgfx-layer.bgfx-full{inset:0;}
.bgfx-layer.bgfx-left{top:0;bottom:0;left:0;}
.bgfx-layer.bgfx-right{top:0;bottom:0;right:0;}
.bgfx-layer.bgfx-top{top:0;left:0;right:0;}
.bgfx-layer.bgfx-bottom{bottom:0;left:0;right:0;}
.bgfx-image{position:absolute;inset:0;background-size:cover;background-position:center;}
.bgfx-overlay{position:absolute;inset:0;background:#fbfaf7;}

.bg-field{border:1px solid var(--ed-border);border-radius:8px;padding:10px;margin-top:12px;background:#fafbfc;}
.bg-field .field-label{margin-bottom:6px;}
.bg-field input[type=range]{width:100%;margin-top:4px;}

.img-adjust{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ed-border);}
.img-adjust .field{margin-bottom:8px;}
.img-adjust input[type=range]{width:100%;margin-top:2px;}
.img-adjust-toggles{display:flex;gap:16px;margin-top:2px;}
.img-adjust-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ed-muted);cursor:pointer;}

/* ---------- Help / User Manual modal ---------- */
.help-modal-backdrop{
  position:fixed;inset:0;background:rgba(15,17,22,.6);z-index:200;
  display:none;align-items:center;justify-content:center;padding:24px;
}
.help-modal-backdrop.open{display:flex;}
.help-modal{
  background:#fff;width:100%;max-width:760px;max-height:88vh;border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4);
}
.help-modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--ed-border);flex-shrink:0;background:#fff;
}
.help-modal-title{font-weight:700;font-size:15px;color:var(--ed-ink);}
.help-modal-body{overflow-y:auto;padding:22px 26px 36px;color:var(--ed-ink);font-size:13.5px;line-height:1.6;}
.help-modal-body h2{font-size:16px;font-weight:700;color:var(--ed-ink);margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--ed-border);}
.help-modal-body h2:first-child{margin-top:0;padding-top:0;border-top:none;}
.help-modal-body h3{font-size:13.5px;font-weight:700;color:var(--ed-accent-dark);margin:16px 0 6px;}
.help-modal-body p{margin:0 0 10px;}
.help-modal-body ul,.help-modal-body ol{margin:0 0 12px;padding-left:20px;}
.help-modal-body li{margin-bottom:5px;}
.help-modal-body table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:12.5px;}
.help-modal-body th{background:#f3f4f6;text-align:left;padding:7px 9px;font-weight:700;border-bottom:2px solid var(--ed-border);}
.help-modal-body td{padding:7px 9px;border-bottom:1px solid var(--ed-border);vertical-align:top;}
.help-modal-body code{background:#f0f1f3;padding:1px 5px;border-radius:4px;font-size:12px;}
.help-modal-body .help-note{background:#f0faf9;border:1px solid #cdeae6;border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:12.5px;}

.split-page{display:flex;flex:1;min-height:0;}
.split-image{flex-grow:0;flex-shrink:0;background-size:cover;background-position:center;background-color:#e7e7e7;}
.split-text{flex:1;padding:32px 38px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}

.contact-hero{position:relative;min-height:1123px;color:#fff;}
.contact-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.contact-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,42,62,.5), rgba(0,0,0,.8));}
.contact-content{position:relative;z-index:2;padding:44px;min-height:1123px;display:flex;flex-direction:column;}
.contact-content .doc-h2{color:#fff;}
.contact-blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:auto;}
.contact-block{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:14px 16px;}
.contact-block h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);}
.contact-block div{font-size:11.5px;line-height:1.6;color:#f2f2f2;}

.page-break-line{position:absolute;left:0;right:0;border-top:2px dashed rgba(192,57,43,.5);z-index:5;}
.page-break-line span{position:absolute;right:8px;top:-16px;font-size:9px;color:#c0392b;background:#fff;padding:1px 6px;border-radius:3px;white-space:nowrap;}
body.exporting .page-break-line{display:none;}

@media print{ .topbar,#sidebar,#addBar{display:none !important;} }

/* =====================================================================
   STUDIO+ ENHANCEMENTS (additive) — tabs, Style tab, CSV import,
   JSON templates, toasts. Everything is prefixed .ex- / #ex / #st / #csv
   ===================================================================== */
.ex-tabs{position:sticky;top:-14px;z-index:7;display:flex;gap:2px;background:var(--ed-panel);margin:-14px -14px 24px;padding:8px 10px 0;height:46px;border-bottom:1px solid var(--ed-border);}
.ex-tab{flex:1;border:none;background:none;padding:8px 4px 10px;font-size:12.5px;font-weight:600;color:var(--ed-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:inherit;}
.ex-tab:hover{color:var(--ed-ink);}
.ex-tab.active{color:var(--ed-accent-dark);border-bottom-color:var(--ed-accent);}
#addBar{top:32px;}
.ex-panel{display:none;}
.ex-panel.show{display:block;}
.ex-sectools{display:flex;gap:6px;margin-bottom:12px;}
.ex-sectools .ex-input{flex:1;}

.ex-card{border:1px solid var(--ed-border);border-radius:10px;padding:12px 12px 14px;margin-bottom:12px;background:#fff;}
.ex-card h4{margin:0 0 3px;font-size:13.5px;color:var(--ed-ink);}
.ex-card h5{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.35px;color:var(--ed-muted);}
.ex-sub{font-size:11.5px;color:var(--ed-muted);margin:0 0 10px;line-height:1.5;}
.ex-hint{font-size:11px;color:var(--ed-muted);margin:6px 0 0;line-height:1.5;}
.ex-lbl{font-size:11px;font-weight:600;color:var(--ed-muted);text-transform:uppercase;letter-spacing:.3px;margin:12px 0 5px;display:flex;align-items:center;gap:6px;}
.ex-tag{font-size:9.5px;font-weight:700;background:#eef0f3;color:var(--ed-muted);padding:1px 6px;border-radius:8px;text-transform:none;letter-spacing:0;}
.ex-tag.custom{background:#e6f6f4;color:var(--ed-accent-dark);}
.ex-step{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--ed-muted);margin:14px 0 6px;}
.ex-step b{background:var(--ed-accent);color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}

.ex-input,.ex-select{width:100%;border:1px solid var(--ed-border);border-radius:7px;padding:8px 9px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--ed-ink);}
.ex-input:focus,.ex-select:focus{outline:none;border-color:var(--ed-accent);box-shadow:0 0 0 3px rgba(13,148,136,.12);}
textarea.ex-input{resize:vertical;line-height:1.4;}
.ex-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.ex-row.mt{margin-top:8px;}
.ex-btn{border:1px solid var(--ed-border);background:#fff;color:var(--ed-ink);border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-family:inherit;transition:.12s;}
.ex-btn:hover{background:#f3f5f7;border-color:#c9ced6;}
.ex-btn.primary{background:var(--ed-accent);border-color:var(--ed-accent);color:#fff;}
.ex-btn.primary:hover{background:var(--ed-accent-dark);}
.ex-btn.danger:hover{background:#fde3e3;border-color:#f5b5b5;color:var(--ed-danger);}
.ex-btn.sm{padding:4px 8px;font-size:11px;}
.ex-btn:disabled{opacity:.45;cursor:not-allowed;}

.ex-seg{display:flex;border:1px solid var(--ed-border);border-radius:8px;overflow:hidden;}
.ex-seg button{flex:1;border:none;background:#fff;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ed-muted);border-right:1px solid var(--ed-border);font-family:inherit;}
.ex-seg button:last-child{border-right:none;}
.ex-seg button:hover{background:#f3f5f7;}
.ex-seg button.on{background:var(--ed-accent);color:#fff;}

.ex-slider{display:flex;align-items:center;gap:10px;}
.ex-slider input[type=range]{flex:1;accent-color:var(--ed-accent);}
.ex-val{width:46px;text-align:right;font-size:12px;font-weight:700;color:var(--ed-ink);}
.ex-colorrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ex-colorrow input[type=color]{width:34px;height:30px;border:1px solid var(--ed-border);border-radius:7px;padding:2px;background:#fff;cursor:pointer;}
.ex-swatches{display:flex;gap:5px;flex-wrap:wrap;flex:1;}
.ex-sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9ced6;cursor:pointer;padding:0;}
.ex-sw:hover{transform:scale(1.15);}

.ex-drop{border:2px dashed #c9ced6;border-radius:10px;padding:16px 10px;text-align:center;font-size:12px;color:var(--ed-muted);cursor:pointer;background:#fafbfc;transition:.12s;line-height:1.5;}
.ex-drop:hover,.ex-drop.over{border-color:var(--ed-accent);background:#f0faf9;color:var(--ed-accent-dark);}
.ex-drop b{color:var(--ed-ink);}
details.ex-details{margin-top:8px;font-size:12px;}
details.ex-details summary{cursor:pointer;color:var(--ed-accent-dark);font-weight:600;}
details.ex-details textarea{margin:8px 0 6px;}

.ex-scroll{overflow:auto;max-height:190px;border:1px solid var(--ed-border);border-radius:8px;margin-top:8px;}
.ex-table{width:100%;border-collapse:collapse;font-size:11px;}
.ex-table th{background:#f3f4f6;text-align:left;padding:5px 7px;font-weight:700;position:sticky;top:0;white-space:nowrap;}
.ex-table td{padding:5px 7px;border-top:1px solid var(--ed-border);vertical-align:top;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
.ex-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ex-chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:#eef0f3;color:var(--ed-ink);}
.ex-chip.ok{background:#e3f6ea;color:#166534;}
.ex-chip.warn{background:#fef3c7;color:#92400e;}
.ex-note{font-size:11.5px;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.5;}
.ex-note.ok{background:#f0faf9;border:1px solid #cdeae6;}
.ex-note.warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f;}
.ex-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ed-muted);margin-top:8px;cursor:pointer;}

.ex-tplitem{display:flex;align-items:center;gap:6px;border:1px solid var(--ed-border);border-radius:8px;padding:7px 9px;margin-top:6px;background:#fafbfc;}
.ex-tplitem .nm{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ex-tplitem .meta{font-size:10.5px;color:var(--ed-muted);font-weight:400;display:block;}

.ex-toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.ex-toast{background:#14161c;color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:4px solid var(--ed-accent);max-width:80vw;transition:opacity .3s;}
.ex-toast.err{border-left-color:var(--ed-danger);}
body.exporting .ex-toast-wrap{display:none;}

/* =====================================================================
   STUDIO+ PHASE 2 — undo/redo, drag reorder, projects, themes, rich text,
   page settings, export dialog, review checks
   ===================================================================== */
.ex-tab{padding-left:2px;padding-right:2px;font-size:12px;}
.btn:disabled{opacity:.4;}
.ex-handle{cursor:grab;color:#9aa1ad;font-size:15px;line-height:1;padding:0 2px;flex-shrink:0;user-select:none;}
.ex-handle:hover{color:var(--ed-accent-dark);}
.section-card.ex-dragging{opacity:.4;}
.section-card.ex-over-before{box-shadow:0 -3px 0 0 var(--ed-accent);}
.section-card.ex-over-after{box-shadow:0 3px 0 0 var(--ed-accent);}

.ex-theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;}
.ex-theme{border:1px solid var(--ed-border);background:#fff;border-radius:8px;padding:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--ed-ink);display:flex;flex-direction:column;gap:5px;align-items:stretch;font-family:inherit;}
.ex-theme:hover{border-color:var(--ed-accent);background:#f0faf9;}
.ex-theme .chips{display:flex;height:16px;border-radius:4px;overflow:hidden;}
.ex-theme .chips span{flex:1;}
.ex-check-row{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:6px 0;cursor:pointer;}
.ex-chipbtn{border:1px solid var(--ed-border);background:#fff;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ed-muted);}
.ex-chipbtn:hover{border-color:var(--ed-accent);color:var(--ed-accent-dark);}

.ex-fmt{position:fixed;z-index:300;display:none;gap:2px;background:#14161c;border-radius:8px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.ex-fmt.show{display:flex;}
.ex-fmt button{border:none;background:none;color:#fff;width:28px;height:26px;border-radius:5px;cursor:pointer;font-size:13px;font-family:inherit;}
.ex-fmt button:hover{background:#343945;}
.ex-fmt .hint{color:#9aa1ad;font-size:10.5px;align-self:center;padding:0 6px 0 4px;}

.page strong{font-weight:700;}
.page mark{background:#fff3a3;color:inherit;padding:0 2px;border-radius:2px;}
.ex-wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-30deg);font-weight:800;color:#000;white-space:nowrap;pointer-events:none;z-index:40;letter-spacing:4px;line-height:1;}

.ex-issue{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--ed-border);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fff;font-size:12px;line-height:1.45;}
.ex-issue .ic{flex-shrink:0;font-size:14px;line-height:1.3;}
.ex-issue .tx{flex:1;min-width:0;}
.ex-issue .tx small{display:block;color:var(--ed-muted);font-size:11px;}
.ex-issue.err{border-color:#f5b5b5;background:#fef6f6;}
.ex-issue.warn{border-color:#fde68a;background:#fffdf3;}
.ex-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.ex-stat{flex:1;min-width:70px;border:1px solid var(--ed-border);border-radius:8px;padding:7px 8px;text-align:center;background:#fff;}
.ex-stat b{display:block;font-size:17px;color:var(--ed-ink);}
.ex-stat span{font-size:10.5px;color:var(--ed-muted);text-transform:uppercase;letter-spacing:.3px;}

.ex-proj{display:flex;align-items:center;gap:6px;border:1px solid var(--ed-border);border-radius:9px;padding:9px 11px;margin-top:7px;background:#fafbfc;}
.ex-proj.cur{border-color:var(--ed-accent);background:#f0faf9;}
.ex-proj .nm{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ex-proj .meta{display:block;font-weight:400;font-size:11px;color:var(--ed-muted);}
.ex-progress{height:8px;border-radius:6px;background:#e5e7eb;overflow:hidden;margin:10px 0 4px;}
.ex-progress i{display:block;height:100%;width:0;background:var(--ed-accent);transition:width .15s;}
.help-modal-body .ex-card{margin-bottom:14px;}
.help-modal-body h4{font-size:13.5px;}

/* =====================================================================
   STUDIO+ PHASE 3 — brochure styles (IIT Jammu / IIM Bodh Gaya looks)
   and pro section types. Prefix: .x-  /  .lay-*  /  .look-*
   ===================================================================== */
.page.lay-iit,.page.lay-iim{font-family:'Poppins','Inter',system-ui,sans-serif;}
.lay-iit .doc-h2,.lay-iim .doc-h2{font-family:'Poppins','Inter',sans-serif;font-weight:700;text-align:center;letter-spacing:.2px;}
.lay-iit.look-light .doc-h2{text-transform:uppercase;font-size:28px;margin-bottom:22px;}
.lay-iim.look-light .doc-h2,.lay-iim.look-dark .doc-h2{font-size:34px;margin-bottom:24px;}
.lay-iit .doc-p,.lay-iim .doc-p,.lay-iit .doc-ul li,.lay-iim .doc-ul li{font-family:'Poppins','Inter',sans-serif;}
.lay-iit .page-body,.lay-iim .page-body{padding:40px 46px 24px;}
.lay-iit .page-body.no-pad,.lay-iim .page-body.no-pad{padding:0;}

/* header band (IIT) */
.x-band{background:var(--ink);padding:26px 40px 24px;text-align:center;flex-shrink:0;border-bottom:7px solid var(--accent);}
.x-band-t{font-family:'Poppins','Inter',sans-serif;font-weight:700;font-size:28px;color:var(--accent);text-transform:uppercase;letter-spacing:.3px;line-height:1.2;}
.look-band .section-hit .doc-h2:first-of-type{display:none;}
.look-band .page-body{padding-top:30px;}

/* dark pages */
.page.look-dark{background:var(--ink) !important;color:#fff;}
.look-dark .doc-h2{color:var(--accent) !important;}
.look-dark .doc-p,.look-dark .doc-ul li,.look-dark .doc-ol li{color:#eef2f7;}
.look-dark .doc-ul.check li:before{color:var(--accent);}
.look-dark .x-note{color:#e5e9f0;}

/* IIM corner art + footer */
.x-corner{position:absolute;top:0;pointer-events:none;z-index:2;}
.x-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 40px 18px;flex-shrink:0;position:relative;}
.x-foot:before{content:"";position:absolute;left:46px;right:46px;top:50%;height:2px;background:var(--ink);opacity:.9;z-index:0;}
.look-dark .x-foot:before{background:#fff;}
.x-pn{position:relative;z-index:1;font-weight:800;font-size:15px;color:var(--ink);background:var(--paper);padding:2px 10px 2px 0;}
.look-dark .x-pn{background:var(--ink);color:#fff;}
.x-assoc{position:relative;z-index:1;display:flex;align-items:center;gap:7px;font-size:12px;color:#222;background:var(--paper);padding:2px 0 2px 10px;font-weight:500;}
.look-dark .x-assoc{background:var(--ink);color:#fff;}
.x-assoc img{height:24px;object-fit:contain;}
.x-assoc b{font-weight:800;color:var(--ink);font-size:15px;}
.look-dark .x-assoc b{color:#fff;}

/* shared */
.x-note{font-size:12.5px;line-height:1.6;margin-top:14px;color:#444;}
.x-note.it{font-style:italic;}
.x-intro{font-size:14px;line-height:1.65;text-align:center;margin:0 0 20px;}
.x-ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.x-ico svg{display:block;}

/* covers */
.x-cover{position:relative;min-height:1123px;overflow:hidden;display:flex;flex-direction:column;font-family:'Poppins','Inter',sans-serif;}
.x-cover .x-photo{position:absolute;inset:0;background-size:cover;background-position:center;}
.x-cover-c{background:linear-gradient(180deg,#cde4f5 0%,#e8f3fa 55%,#d9ecf5 100%);}
.x-cover-c .x-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.1) 45%,rgba(255,255,255,0) 100%);}
.x-cover-c .x-logos{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:60px 70px 0;gap:20px;}
.x-cover-c .x-logos img{height:68px;max-width:230px;object-fit:contain;}
.x-cover-c .x-ct{position:relative;z-index:2;margin-top:230px;text-align:center;padding:0 60px;color:var(--ink);}
.x-cover-c .x-k{font-weight:800;font-size:25px;letter-spacing:.3px;text-transform:uppercase;padding-bottom:20px;border-bottom:3px solid var(--ink);display:inline-block;}
.x-cover-c .x-l1{font-weight:800;font-size:44px;line-height:1.1;margin-top:46px;text-transform:uppercase;}
.x-cover-c .x-l2{font-weight:800;font-size:56px;line-height:1.1;text-transform:uppercase;}
.x-cover-c .x-sub{font-weight:800;font-size:28px;margin-top:40px;text-transform:uppercase;}
.x-cover-d{background:#fff;}
.x-cover-d .x-top{position:relative;z-index:3;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:28px 50px;height:150px;}
.x-cover-d .x-top img{height:78px;max-width:330px;object-fit:contain;}
.x-cover-d .x-photo{top:150px;}
.x-cover-d .x-tri{position:absolute;left:0;right:0;bottom:0;height:520px;z-index:2;}
.x-cover-d .x-dt{position:absolute;left:0;bottom:0;z-index:3;padding:0 60px 120px 50px;width:100%;}
.x-cover-d .x-k{font-weight:700;font-size:30px;color:var(--accent);}
.x-cover-d .x-l1{font-weight:800;font-size:68px;line-height:1.08;color:var(--accent);margin-top:2px;max-width:620px;}
.x-cover-d .x-sub{position:absolute;right:48px;bottom:46px;z-index:3;font-weight:800;font-size:34px;color:var(--ink);}

/* people / message */
.x-people{display:flex;gap:56px;justify-content:center;margin:6px 0 26px;}
.x-person{text-align:center;}
.x-person .ph{width:250px;height:340px;background:#dfe5ea center/cover no-repeat;border:8px solid var(--ink);border-bottom:0;box-sizing:border-box;}
.x-person .pl{background:var(--ink);color:var(--accent);font-weight:800;font-size:20px;padding:10px 8px;width:250px;box-sizing:border-box;}
.x-person .pr{font-size:12px;color:#555;margin-top:6px;}
.x-letter p{font-size:13.5px;line-height:1.75;margin:0 0 14px;text-align:justify;color:#1d2530;}
.x-sign{display:flex;justify-content:space-between;gap:30px;margin-top:22px;font-size:13px;line-height:1.9;}
.x-sign div{min-width:0;}
.x-stack .x-sp{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;}
.x-stack .ph{width:330px;height:340px;border-radius:26px;background:#dfe5ea center/cover no-repeat;}
.x-stack .pn{font-weight:800;font-size:19px;margin-top:14px;color:#222;}
.x-stack .pr{font-weight:600;font-size:14px;color:#222;}

/* card grid */
.x-badges{display:flex;flex-direction:column;gap:30px;margin-top:6px;}
.x-badge{position:relative;background:#ecedee;border-radius:12px;padding:18px 150px 18px 22px;min-height:104px;display:flex;flex-direction:column;justify-content:center;}
.x-badge.l{padding:18px 22px 18px 150px;}
.x-badge h4{margin:0 0 4px;font-size:18px;font-weight:700;color:#1b1f26;}
.x-badge p{margin:0;font-size:14px;line-height:1.5;color:#2c333c;}

<script>
/* =========================================================
   Brochure Studio — data model, editor UI, preview, PDF export
   ========================================================= */

const A4_W_PX = 794;      // 210mm @ 96dpi
const A4_H_PX = 1123;     // 297mm @ 96dpi
const A4_W_MM = 210;
const A4_H_MM = 297;

/* ---------- helpers ---------- */
const uid = () => 'id' + Math.random().toString(36).slice(2, 9);
function esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function nl2p(s) {
  return esc(s).split(/\n+/).filter(Boolean).map(p => `<p class="doc-p">${p}</p>`).join('');
}
/* Renders a stat-box with a value font-size that scales down for longer
   text (e.g. "Sun, 1:00 – 4:15 PM") so it doesn't wrap awkwardly. */
function statBox(label, value) {
  const len = (value || '').length;
  const sizeClass = len > 18 ? ' sv-sm' : len > 11 ? ' sv-md' : '';
  return `<div class="stat-box"><div class="sl">${esc(label)}</div><div class="sv${sizeClass}">${esc(value)}</div></div>`;
}
function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
/* Bakes the blur into the image's actual pixels (via canvas) rather than
   using CSS `filter:blur()`, because the PDF export (html2canvas) does not
   reliably render CSS filters — this keeps the preview and the exported
   PDF identical. Slightly overscans the source before blurring so the
   edges don't fade to transparent. */
function applyBlurToImage(srcDataUrl, blurPx) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || 800, h = img.naturalHeight || 600;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (blurPx > 0) {
        try { ctx.filter = `blur(${blurPx}px)`; } catch (e) { /* unsupported — draw unblurred */ }
        const overscan = 1 + Math.min(blurPx / 40, 0.15);
        const dw = w * overscan, dh = h * overscan;
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      } else {
        ctx.drawImage(img, 0, 0, w, h);
      }
      try { resolve(canvas.toDataURL('image/jpeg', 0.85)); }
      catch (e) { resolve(srcDataUrl); } // e.g. tainted canvas — fall back to the original
    };
    img.onerror = () => reject(new Error('Could not load image for blurring'));
    img.src = srcDataUrl;
  });
}
/* Wraps a rendered section's HTML with an optional blurred background
   image layer, anchored to a page edge (or the full page) at an adjustable
   size, with the text overlaid on top rather than pushed aside.
   `bg` = { image (pre-blurred dataURL), placement, size }.
   `scope` = 'page' (this section owns the whole page — break out to the
   true page edges) or 'block' (this section shares the page with other
   merged sections — only break out horizontally). */
function wrapWithBackground(innerHtml, bg, scope) {
  if (!bg || !bg.image) return innerHtml;
  const placement = bg.placement || 'full';
  const size = bg.size || 40;
  let sizeStyle = '';
  if (placement === 'left' || placement === 'right') sizeStyle = `width:${size}%;`;
  else if (placement === 'top' || placement === 'bottom') sizeStyle = `height:${size}%;`;
  const scopeClass = scope === 'block' ? 'bgfx-scope-block' : 'bgfx-scope-page';
  // Only the blur itself softens the image at blur=0 (verified: pixel-sharp).
  // The readability wash still scales up a little with blur, since a more
  // blurred image tends to sit lower-contrast anyway and can take more
  // wash before text gets hard to read against it.
  const blurPx = bg.blur == null ? 8 : bg.blur;
  const overlayOpacity = (0.12 + Math.min(blurPx, 20) / 20 * 0.35).toFixed(2);
  return `<div class="bgfx-wrap ${scopeClass}">
    <div class="bgfx-layer bgfx-${placement}" style="${sizeStyle}">
      <div class="bgfx-image" style="background-image:url('${bg.image}')"></div>
      <div class="bgfx-overlay" style="opacity:${overlayOpacity}"></div>
    </div>
    <div class="bgfx-content">${innerHtml}</div>
  </div>`;
}
function h(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (attrs[k] == null) continue;
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

/* ---------- state ---------- */
let state = {
  accent: '#c0392b',
  ink: '#0f2a3e',
  footerText: 'In association with Medharthi',
  footerLogo: '',
  sections: []
};

function persist() {
  try { localStorage.setItem('brochureStudioState', JSON.stringify(state)); } catch (e) { /* ignore quota errors */ }
}
function loadPersisted() {
  try {
    const raw = localStorage.getItem('brochureStudioState');
    if (raw) { state = JSON.parse(raw); return true; }
  } catch (e) { /* ignore */ }
  return false;
}

/* ---------- generic field builders (return DOM nodes) ---------- */
function fieldWrap(label, node) {
  return h('label', { class: 'field' }, [h('span', { class: 'field-label' }, label), node]);
}
function textField(label, obj, key, onChange, placeholder) {
  const input = h('input', {
    type: 'text', value: obj[key] || '', placeholder: placeholder || '',
    oninput: e => { obj[key] = e.target.value; onChange(); }
  });
  return fieldWrap(label, input);
}
function textareaField(label, obj, key, onChange, placeholder) {
  const t = h('textarea', {
    placeholder: placeholder || '',
    oninput: e => { obj[key] = e.target.value; onChange(); }
  });
  t.value = obj[key] || '';
  return fieldWrap(label, t);
}
function selectField(label, obj, key, options, onStructural) {
  const sel = h('select', {
    style: 'width:100%;border:1px solid var(--ed-border);border-radius:6px;padding:7px 9px;font-size:13px;background:#fff;',
    onchange: e => { obj[key] = e.target.value; onStructural(); }
  });
  options.forEach(([val, lbl]) => {
    const opt = h('option', { value: val }, lbl);
    if ((obj[key] || options[0][0]) === val) opt.setAttribute('selected', 'selected');
    sel.appendChild(opt);
  });
  return fieldWrap(label, sel);
}
/* Image fields store either a plain string (legacy) or a compound object
   { src, blurredSrc, size, blur, shadow, border }. These three helpers let
   render() code work with either shape without caring which one it is. */
function imgVal(val) {
  if (!val) return { src: '', blurredSrc: '', size: 100, blur: 0, shadow: false, border: false };
  if (typeof val === 'string') return { src: val, blurredSrc: '', size: 100, blur: 0, shadow: false, border: false };
  return val;
}
function imgSrc(val) {
  const v = imgVal(val);
  return v.blurredSrc || v.src || '';
}
function imgExtraStyle(val) {
  const v = imgVal(val);
  const parts = [];
  const size = v.size || 100;
  if (size !== 100) parts.push(`transform:scale(${(size / 100).toFixed(2)});`);
  if (v.shadow) parts.push('box-shadow:0 6px 20px rgba(0,0,0,.3);');
  if (v.border) parts.push('border:3px solid var(--ink);');
  return parts.join('');
}
function imageField(label, obj, key, onChange, onStructural) {
  const cur = obj[key];
  const src = typeof cur === 'string' ? cur : (cur && cur.src) || '';
  const wrap = h('div', { class: 'field' });
  wrap.appendChild(h('span', { class: 'field-label' }, label));

  const row = h('div', { class: 'img-drop' });
  if (src) {
    const displaySrc = (typeof cur === 'object' && cur.blurredSrc) || src;
    row.appendChild(h('img', { class: 'thumb', src: displaySrc }));
    row.appendChild(h('button', {
      class: 'icon-btn danger', type: 'button', title: 'Remove image',
      onclick: () => { obj[key] = ''; onStructural(); }
    }, '✕ remove'));
  } else {
    const input = h('input', { type: 'file', accept: 'image/*' });
    input.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      obj[key] = { src: await readFileAsDataURL(file), blurredSrc: '', size: 100, blur: 0, shadow: false, border: false };
      onStructural();
    });
    row.appendChild(input);
  }
  wrap.appendChild(row);

  if (src) {
    // Upgrade a legacy plain-string value in place so the adjustments
    // below have an object to persist onto.
    if (typeof obj[key] === 'string') {
      obj[key] = { src: obj[key], blurredSrc: '', size: 100, blur: 0, shadow: false, border: false };
    }
    wrap.appendChild(imageAdjustControls(obj[key], onChange));
  }
  return wrap;
}
/* Size / blur / shadow / border adjustments shown under any uploaded image.
   Blur is baked into the pixels (via applyBlurToImage) rather than left as
   a CSS filter, since the PDF export doesn't reliably capture CSS filters —
   see the background-image feature for the same reasoning. */
function imageAdjustControls(img, onChange) {
  const box = h('div', { class: 'img-adjust' });

  const sizeWrap = h('label', { class: 'field' });
  const sizeLabel = h('span', { class: 'field-label' }, `Size (${img.size || 100}%)`);
  const sizeSlider = h('input', { type: 'range', min: '60', max: '140', step: '5' });
  sizeSlider.value = img.size || 100;
  sizeSlider.oninput = () => { img.size = parseInt(sizeSlider.value, 10); sizeLabel.textContent = `Size (${img.size}%)`; };
  sizeSlider.onchange = () => onChange();
  sizeWrap.append(sizeLabel, sizeSlider);
  box.appendChild(sizeWrap);

  const blurWrap = h('label', { class: 'field' });
  const blurLabel = h('span', { class: 'field-label' }, `Blur (${img.blur || 0}px)`);
  const blurSlider = h('input', { type: 'range', min: '0', max: '20', step: '1' });
  blurSlider.value = img.blur || 0;
  blurSlider.oninput = () => { img.blur = parseInt(blurSlider.value, 10); blurLabel.textContent = `Blur (${img.blur}px)`; };
  blurSlider.onchange = async () => {
    img.blurredSrc = img.blur > 0 ? await applyBlurToImage(img.src, img.blur) : '';
    onChange();
  };
  blurWrap.append(blurLabel, blurSlider);
  box.appendChild(blurWrap);

  const toggleRow = h('div', { class: 'img-adjust-toggles' });
  const shadowLabel = h('label', { class: 'img-adjust-toggle' });
  const shadowCb = h('input', { type: 'checkbox' });
  shadowCb.checked = !!img.shadow;
  shadowCb.onchange = () => { img.shadow = shadowCb.checked; onChange(); };
  shadowLabel.append(shadowCb, document.createTextNode(' Shadow'));

  const borderLabel = h('label', { class: 'img-adjust-toggle' });
  const borderCb = h('input', { type: 'checkbox' });
  borderCb.checked = !!img.border;
  borderCb.onchange = () => { img.border = borderCb.checked; onChange(); };
  borderLabel.append(borderCb, document.createTextNode(' Border'));

  toggleRow.append(shadowLabel, borderLabel);
  box.appendChild(toggleRow);
  return box;
}
/* Generic "blurred background image" control shown on every section
   (except Cover / Connect With Us, which already have their own).
   Blur is baked into the pixels via applyBlurToImage so the PDF export
   matches the preview exactly. */
function backgroundImageField(section, onChange, onStructural) {
  if (!section.background) section.background = { image: '', raw: '', blur: 8, placement: 'full', size: 40 };
  const bg = section.background;
  const wrap = h('div', { class: 'bg-field' });
  wrap.appendChild(h('div', { class: 'field-label' }, 'Page background image (optional)'));

  const row = h('div', { class: 'img-drop' });
  if (bg.raw) {
    row.appendChild(h('img', { class: 'thumb', src: bg.raw }));
    row.appendChild(h('button', {
      class: 'icon-btn danger', type: 'button', title: 'Remove background image',
      onclick: () => { bg.image = ''; bg.raw = ''; onStructural(); }
    }, '✕ remove'));
  } else {
    const input = h('input', { type: 'file', accept: 'image/*' });
    input.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      bg.raw = await readFileAsDataURL(file);
      bg.image = await applyBlurToImage(bg.raw, bg.blur);
      onStructural();
    });
    row.appendChild(input);
  }
  wrap.appendChild(row);

  if (bg.raw) {
    const blurWrap = h('label', { class: 'field' });
    const blurLabel = h('span', { class: 'field-label' }, `Blur amount (${bg.blur}px)`);
    const slider = h('input', { type: 'range', min: '0', max: '20', step: '1' });
    slider.value = bg.blur;
    slider.oninput = () => { bg.blur = parseInt(slider.value, 10); blurLabel.textContent = `Blur amount (${bg.blur}px)`; };
    slider.onchange = async () => { bg.image = await applyBlurToImage(bg.raw, bg.blur); onChange(); };
    blurWrap.append(blurLabel, slider);
    wrap.appendChild(blurWrap);

    wrap.appendChild(selectField('Placement on the page', bg, 'placement', [
      ['full', 'Full page (behind all content)'],
      ['left', 'Left edge'],
      ['right', 'Right edge'],
      ['top', 'Top edge'],
      ['bottom', 'Bottom edge']
    ], onStructural));

    if (bg.placement && bg.placement !== 'full') {
      const sizeWrap = h('label', { class: 'field' });
      const sizeLabel = h('span', { class: 'field-label' }, `Image size (${bg.size || 40}% of page)`);
      const sizeSlider = h('input', { type: 'range', min: '15', max: '70', step: '5' });
      sizeSlider.value = bg.size || 40;
      sizeSlider.oninput = () => { bg.size = parseInt(sizeSlider.value, 10); sizeLabel.textContent = `Image size (${bg.size}% of page)`; };
      sizeSlider.onchange = () => onChange();
      sizeWrap.append(sizeLabel, sizeSlider);
      wrap.appendChild(sizeWrap);
    }

    wrap.appendChild(h('div', { class: 'hint' }, 'Text is overlaid on top of the image, not pushed aside — a soft wash keeps it readable.'));
  }
  return wrap;
}
/* Lighter variant of imageAdjustControls for a *group* of small icons that
   share one adjustment (e.g. Tools Covered logos) rather than per-image
   controls — blur is left out here since baking it into several small
   icons individually isn't worth the added complexity for this case. */
function imageGroupAdjustControls(styleObj, onChange) {
  const box = h('div', { class: 'img-adjust' });
  const sizeWrap = h('label', { class: 'field' });
  const sizeLabel = h('span', { class: 'field-label' }, `Icon size (${styleObj.size || 100}%)`);
  const sizeSlider = h('input', { type: 'range', min: '60', max: '140', step: '5' });
  sizeSlider.value = styleObj.size || 100;
  sizeSlider.oninput = () => { styleObj.size = parseInt(sizeSlider.value, 10); sizeLabel.textContent = `Icon size (${styleObj.size}%)`; };
  sizeSlider.onchange = () => onChange();
  sizeWrap.append(sizeLabel, sizeSlider);
  box.appendChild(sizeWrap);

  const toggleRow = h('div', { class: 'img-adjust-toggles' });
  const shadowLabel = h('label', { class: 'img-adjust-toggle' });
  const shadowCb = h('input', { type: 'checkbox' });
  shadowCb.checked = !!styleObj.shadow;
  shadowCb.onchange = () => { styleObj.shadow = shadowCb.checked; onChange(); };
  shadowLabel.append(shadowCb, document.createTextNode(' Shadow'));

  const borderLabel = h('label', { class: 'img-adjust-toggle' });
  const borderCb = h('input', { type: 'checkbox' });
  borderCb.checked = !!styleObj.border;
  borderCb.onchange = () => { styleObj.border = borderCb.checked; onChange(); };
  borderLabel.append(borderCb, document.createTextNode(' Border'));

  toggleRow.append(shadowLabel, borderLabel);
  box.appendChild(toggleRow);
  return box;
}
function imageListField(label, arr, styleHost, styleKey, onChange, onStructural) {
  const styleProp = styleKey + 'Style';
  if (!styleHost[styleProp]) styleHost[styleProp] = { size: 100, shadow: false, border: false };
  const groupStyle = styleHost[styleProp];
  const wrap = h('div', { class: 'field' });
  wrap.appendChild(h('span', { class: 'field-label' }, label));
  const row = h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;' });
  arr.forEach((val, idx) => {
    const box = h('div', { style: 'position:relative;' });
    box.appendChild(h('img', { src: val, style: `width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--ed-border);display:block;${imgExtraStyle(groupStyle)}` }));
    box.appendChild(h('button', {
      class: 'icon-btn danger', type: 'button', title: 'Remove',
      style: 'position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;font-size:10px;padding:1px 4px;border:1px solid var(--ed-border);',
      onclick: () => { arr.splice(idx, 1); onStructural(); }
    }, '✕'));
    row.appendChild(box);
  });
  const addLabel = h('label', { class: 'btn btn-ghost btn-sm', style: 'cursor:pointer;color:var(--ed-ink);background:#eef0f2;' }, '+ Image');
  const fileInput = h('input', { type: 'file', accept: 'image/*', style: 'display:none;' });
  fileInput.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    arr.push(await readFileAsDataURL(f));
    onStructural();
    e.target.value = '';
  });
  addLabel.appendChild(fileInput);
  row.appendChild(addLabel);
  wrap.appendChild(row);
  if (arr.length) wrap.appendChild(imageGroupAdjustControls(groupStyle, onChange));
  return wrap;
}
function listField(label, arr, onChange, onStructural, multiline) {
  const wrap = h('div', { class: 'field list-editor' });
  wrap.appendChild(h('span', { class: 'field-label' }, label));
  arr.forEach((val, idx) => {
    const row = h('div', { class: 'list-row' });
    const ctl = multiline
      ? h('textarea', { oninput: e => { arr[idx] = e.target.value; onChange(); } })
      : h('input', { type: 'text', value: val, oninput: e => { arr[idx] = e.target.value; onChange(); } });
    if (multiline) ctl.value = val;
    row.appendChild(ctl);
    row.appendChild(h('button', {
      class: 'icon-btn danger', type: 'button', title: 'Remove',
      onclick: () => { arr.splice(idx, 1); onStructural(); }
    }, '✕'));
    wrap.appendChild(row);
  });
  wrap.appendChild(h('button', {
    class: 'add-link', type: 'button',
    onclick: () => { arr.push(''); onStructural(); }
  }, '+ Add item'));
  return wrap;
}

/* Repeatable card group. schema: [{key,label,type:'text'|'textarea'|'image'|'imageList'|'list',placeholder}] */
function repeatGroup(items, schema, onChange, onStructural, addLabel, itemTitleFn) {
  const wrap = h('div', { class: 'repeat-group' });
  items.forEach((item, idx) => {
    const card = h('div', { class: 'item-card' });
    const toolbar = h('div', { class: 'item-toolbar' });
    if (idx > 0) toolbar.appendChild(h('button', {
      class: 'icon-btn', type: 'button', title: 'Move up',
      onclick: () => { [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]]; onStructural(); }
    }, '↑'));
    if (idx < items.length - 1) toolbar.appendChild(h('button', {
      class: 'icon-btn', type: 'button', title: 'Move down',
      onclick: () => { [items[idx + 1], items[idx]] = [items[idx], items[idx + 1]]; onStructural(); }
    }, '↓'));
    toolbar.appendChild(h('button', {
      class: 'icon-btn danger', type: 'button', title: 'Delete',
      onclick: () => { items.splice(idx, 1); onStructural(); }
    }, '🗑'));
    card.appendChild(toolbar);
    if (itemTitleFn) card.appendChild(h('div', { style: 'font-size:11px;font-weight:700;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;' }, itemTitleFn(item, idx)));
    schema.forEach(f => {
      if (f.type === 'image') card.appendChild(imageField(f.label, item, f.key, onChange, onStructural));
      else if (f.type === 'imageList') { if (!item[f.key]) item[f.key] = []; card.appendChild(imageListField(f.label, item[f.key], item, f.key, onChange, onStructural)); }
      else if (f.type === 'textarea') card.appendChild(textareaField(f.label, item, f.key, onChange, f.placeholder));
      else if (f.type === 'list') { if (!item[f.key]) item[f.key] = []; card.appendChild(listField(f.label, item[f.key], onChange, onStructural, f.multiline)); }
      else card.appendChild(textField(f.label, item, f.key, onChange, f.placeholder));
    });
    wrap.appendChild(card);
  });
  wrap.appendChild(h('button', {
    class: 'add-link', type: 'button',
    onclick: () => {
      items.push(schema.reduce((o, f) => (o[f.key] = (f.type === 'list' || f.type === 'imageList') ? [] : '', o), {}));
      onStructural();
    }
  }, addLabel || '+ Add item'));
  return wrap;
}

/* =========================================================
   Manual page merging — the ONLY way sections share a page.
   No automatic pairing/grouping: what the user toggles is what
   they get, so behaviour is predictable and reorder-proof.
   ========================================================= */

/* Types that can't be merged onto a shared page: full-bleed
   hero layouts, and multi-page sections that already paginate themselves. */
const NO_MERGE_TYPES = ['cover', 'contact', 'curriculum'];

/* Cover and Connect With Us already have their own dedicated full-page
   background photo field, so the generic blurred-background option
   (below) is hidden for those two to avoid a confusing duplicate control. */
const NO_BG_TYPES = ['cover', 'contact'];

/* Image+text sections that normally render full-bleed (own page). When
   manually merged with something else, they fall back to this compact
   "thumbnail + text" block instead of their full-bleed layout. */
const SPLIT_IMAGE_TYPES = ['futureProspects', 'industryTrends', 'techBenefits'];

function renderCompactSplitBlock(sec) {
  const d = sec.data;
  const bullets = (d.items && d.items.length) ? `<ul class="doc-ul check">${d.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : '';
  const img = imgSrc(d.image) ? `<div class="stack-image" style="background-image:url('${imgSrc(d.image)}');${imgExtraStyle(d.image)}"></div>` : '';
  return `<div class="stack-block">
    ${img}
    <div class="stack-text">
      <h3>${esc(d.heading)}</h3>
      ${(d.paragraphs || []).map(nl2p).join('')}
      ${bullets}
    </div>
  </div>`;
}

/* Renders a user-chosen "combine with next section" chain: each section's
   own block, stacked in order with a divider between. Split-image types
   use the compact block above instead of their normal full-bleed render. */
function renderManualStackBlocks(secs, state) {
  return secs.map(s => ({
    id: s.id,
    html: SPLIT_IMAGE_TYPES.includes(s.type) ? renderCompactSplitBlock(s) : TYPES[s.type].render(s.data, state).pages[0]
  }));
}

function buildPageUnits(sections) {
  const enabled = sections.filter(s => s.enabled);
  const used = new Set();
  const units = [];

  // Chain together consecutive enabled sections that have "combine with
  // next" toggled on.
  const chainStart = new Map(); // section.id -> ordered chain of sections
  for (let i = 0; i < enabled.length; i++) {
    const sec = enabled[i];
    if (used.has(sec.id) || !sec.mergeNext || NO_MERGE_TYPES.includes(sec.type)) continue;
    const chain = [sec];
    used.add(sec.id);
    let j = i;
    while (
      enabled[j] && enabled[j].mergeNext && !NO_MERGE_TYPES.includes(enabled[j].type) &&
      enabled[j + 1] && !used.has(enabled[j + 1].id) && !NO_MERGE_TYPES.includes(enabled[j + 1].type)
    ) {
      chain.push(enabled[j + 1]);
      used.add(enabled[j + 1].id);
      j++;
    }
    chainStart.set(sec.id, chain);
  }

  enabled.forEach(sec => {
    if (chainStart.has(sec.id)) {
      units.push({ kind: 'manualStack', sections: chainStart.get(sec.id) });
      return;
    }
    if (used.has(sec.id)) return; // consumed as a later member of a manual chain
    units.push({ kind: 'single', section: sec });
  });
  return units;
}

/* =========================================================
   Sample content
   ========================================================= */
function newSection(type) {
  return { id: uid(), type, enabled: true, collapsed: true, mergeNext: false, background: null, data: TYPES[type].defaultData() };
}

/* =========================================================
   Sidebar rendering
   ========================================================= */
function commit(structural) {
  persist();
  renderPreview();
  if (structural) renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sectionList');
  list.innerHTML = '';

  list.appendChild(makeInsertLine(0));

  state.sections.forEach((section, idx) => {
    const impl = TYPES[section.type];
    const card = h('div', {
      class: 'section-card' + (section.enabled ? '' : ' disabled') + (section.id === selectedSectionId ? ' selected' : ''),
      'data-id': section.id
    });

    const head = h('div', {
      class: 'sc-head',
      onclick: (e) => { if (e.target.closest('.sc-actions') || e.target.closest('.switch')) return; section.collapsed = !section.collapsed; renderSidebar(); }
    });
    head.append(
      h('span', { class: 'sc-tag' }, impl.label),
      h('span', { class: 'sc-title' }, sectionTitle(section)),
    );

    // Always render all four action slots (reordering, merge, delete) so
    // rows line up consistently — inapplicable ones are disabled, not hidden.
    const actions = h('div', { class: 'sc-actions' });

    const upBtn = h('button', { class: 'icon-btn', title: 'Move up', onclick: () => { [state.sections[idx - 1], state.sections[idx]] = [state.sections[idx], state.sections[idx - 1]]; commit(true); } }, '↑');
    if (idx === 0) upBtn.disabled = true;
    actions.appendChild(upBtn);

    const downBtn = h('button', { class: 'icon-btn', title: 'Move down', onclick: () => { [state.sections[idx + 1], state.sections[idx]] = [state.sections[idx], state.sections[idx + 1]]; commit(true); } }, '↓');
    if (idx === state.sections.length - 1) downBtn.disabled = true;
    actions.appendChild(downBtn);

    const isLast = idx === state.sections.length - 1;
    const noMergeType = NO_MERGE_TYPES.includes(section.type);
    const canMerge = !isLast && !noMergeType;
    const mergeBtn = h('button', {
      class: 'icon-btn' + (section.mergeNext ? ' merge-active' : ''),
      title: noMergeType ? 'This section type always keeps its own page'
        : isLast ? 'No section follows this one'
        : section.mergeNext ? 'Combined with next section — click to give it its own page again'
        : 'Combine with next section on the same page',
      onclick: () => { section.mergeNext = !section.mergeNext; commit(true); }
    }, '⛓');
    if (!canMerge) mergeBtn.disabled = true;
    actions.appendChild(mergeBtn);

    actions.appendChild(h('button', { class: 'icon-btn danger', title: 'Delete section', onclick: () => { if (confirm('Delete this section?')) { state.sections.splice(idx, 1); commit(true); } } }, '🗑'));

    const switchLabel = h('label', { class: 'switch' });
    const cb = h('input', { type: 'checkbox' });
    cb.checked = section.enabled;
    cb.addEventListener('change', () => { section.enabled = cb.checked; commit(true); });
    switchLabel.append(cb, h('span', { class: 'track' }));

    head.append(switchLabel, actions);
    card.appendChild(head);

    if (!section.collapsed) {
      const body = h('div', { class: 'sc-body' });
      body.appendChild(impl.form(section.data, () => commit(false), () => commit(true)));
      if (!NO_BG_TYPES.includes(section.type)) {
        body.appendChild(backgroundImageField(section, () => commit(false), () => commit(true)));
      }
      card.appendChild(body);
    }
    list.appendChild(card);
    list.appendChild(makeInsertLine(idx + 1));
  });
}

/* A thin hover strip between (and around) section cards that inserts a
   new section — of whatever type is picked in the top dropdown — at
   that exact position, instead of always appending to the end. */
function makeInsertLine(index) {
  const line = h('div', { class: 'insert-line' });
  line.appendChild(h('button', { class: 'insert-btn', title: 'Insert a section here', onclick: () => insertSectionAt(index) }, '+'));
  return line;
}
function insertSectionAt(index) {
  const addSel = document.getElementById('addTypeSelect');
  const type = addSel ? addSel.value : Object.keys(TYPES)[0];
  const sec = newSection(type);
  sec.collapsed = false;
  state.sections.splice(index, 0, sec);
  selectedSectionId = sec.id;
  commit(true);
}

function sectionTitle(section) {
  const d = section.data;
  return d.heading || d.titleMain || TYPES[section.type].label;
}

/* =========================================================
   Preview rendering
   ========================================================= */
function pageShell(inner, eyebrow, idx, total, footerText, footerLogo, fullBleed, stretchBody) {
  const footRight = footerLogo
    ? `<img src="${footerLogo}" style="height:26px;object-fit:contain;vertical-align:middle;margin-right:6px;">${esc(footerText || '')}`
    : `<b>◆</b> ${esc(footerText || '')}`;
  const bodyClass = 'page-body' + (fullBleed ? ' no-pad' : '') + (stretchBody ? ' stretch' : '');
  return `<div class="page" data-page="${idx}">
    <div class="page-head"><div class="eyebrow">${esc(eyebrow || '')}</div></div>
    <div class="${bodyClass}">${inner}</div>
    <div class="page-foot"><span>Page ${idx} of ${total}</span><span>${footRight}</span></div>
  </div>`;
}

function renderPreview() {
  document.documentElement.style.setProperty('--accent', state.accent);
  document.documentElement.style.setProperty('--ink', state.ink);

  const units = buildPageUnits(state.sections);
  const rawPages = [];
  units.forEach(u => {
    if (u.kind === 'manualStack') {
      const blocks = renderManualStackBlocks(u.sections, state);
      const eyebrow = u.sections.map(s => s.data.heading || s.data.titleMain || TYPES[s.type].label).join(' & ');
      const html = blocks.map((b, i) => {
        const sec = u.sections[i];
        const useBg = sec.background && sec.background.image && !NO_BG_TYPES.includes(sec.type);
        const inner = useBg ? wrapWithBackground(b.html, sec.background, 'block') : b.html;
        return `${i > 0 ? '<div class="doc-divider"></div>' : ''}<div class="section-hit" data-section-id="${b.id}">${inner}</div>`;
      }).join('');
      rawPages.push({ html, eyebrow });
    } else {
      const sec = u.section;
      const impl = TYPES[sec.type];
      const result = impl.render(sec.data, state);
      // A section that already renders its own full-bleed image (the three
      // image+text types) skips the generic background to avoid stacking
      // two competing full-page images.
      const useBg = sec.background && sec.background.image && !NO_BG_TYPES.includes(sec.type) && !result.fullBleed;
      const stretchBody = result.fullBleed || useBg;
      result.pages.forEach(p => {
        const inner = useBg ? wrapWithBackground(p, sec.background, 'page') : p;
        rawPages.push({
          html: `<div class="section-hit" data-section-id="${sec.id}">${inner}</div>`,
          eyebrow: result.eyebrow, noShell: result.noShell, fullBleed: result.fullBleed, stretchBody
        });
      });
    }
  });

  const total = rawPages.length;
  const html = rawPages.map((p, i) => {
    if (p.noShell) return `<div class="page" data-page="${i + 1}">${p.html}</div>`;
    return pageShell(p.html, p.eyebrow, i + 1, total, state.footerText, state.footerLogo, p.fullBleed, p.stretchBody);
  }).join('');

  document.getElementById('pages').innerHTML = html || `<div style="color:#888;padding:60px;text-align:center;">No sections enabled. Add a section from the left to get started.</div>`;

  requestAnimationFrame(addPageBreakOverlays);
}

function addPageBreakOverlays() {
  document.querySelectorAll('#pages .page').forEach(page => {
    page.querySelectorAll('.page-break-line').forEach(n => n.remove());
    const height = page.scrollHeight;
    if (height > A4_H_PX + 6) {
      let y = A4_H_PX;
      while (y < height) {
        const line = document.createElement('div');
        line.className = 'page-break-line';
        line.style.top = y + 'px';
        const label = document.createElement('span');
        label.textContent = '↧ continues on next PDF page';
        line.appendChild(label);
        page.appendChild(line);
        y += A4_H_PX;
      }
    }
  });
}

/* =========================================================
   PDF export — slices any overflow onto extra true-A4 pages
   ========================================================= */
async function downloadPdf() {
  const btn = document.getElementById('downloadPdfBtn');
  const zoomSelect = document.getElementById('zoomSelect');
  const prevZoom = zoomSelect.value;
  const originalText = btn.textContent;
  btn.disabled = true;
  document.body.classList.add('exporting');

  const pagesEl = document.getElementById('pages');
  pagesEl.style.transform = 'scale(1)';
  pagesEl.style.width = A4_W_PX + 'px';
  await new Promise(r => setTimeout(r, 80));

  const pageEls = Array.from(document.querySelectorAll('#pages .page'));
  if (!pageEls.length) {
    btn.disabled = false;
    document.body.classList.remove('exporting');
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  let firstSlice = true;

  for (let i = 0; i < pageEls.length; i++) {
    btn.textContent = `Rendering ${i + 1}/${pageEls.length}…`;
    const canvas = await html2canvas(pageEls[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    const pxPerMm = canvas.width / A4_W_MM;
    const sliceHeightPx = A4_H_MM * pxPerMm;
    // A4_W_PX/A4_H_PX (794/1123) are rounded CSS pixels, so the on-screen
    // page height and this exact mm-based slice height disagree by a
    // fraction of a pixel. Without a tolerance, that sub-pixel leftover
    // triggers one extra loop iteration per page — an almost-entirely-blank
    // extra PDF page after every real one. Anything smaller than this gets
    // absorbed into the previous slice instead; genuine overflow content
    // (tens/hundreds of px) is far larger and still splits into real extra
    // pages as intended.
    const roundingTolerancePx = 12;
    let offsetY = 0;
    while (offsetY < canvas.height - 0.5) {
      let thisSliceH = Math.min(sliceHeightPx, canvas.height - offsetY);
      if (canvas.height - (offsetY + thisSliceH) < roundingTolerancePx) {
        thisSliceH = canvas.height - offsetY;
      }
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = thisSliceH;
      const ctx = sliceCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
      ctx.drawImage(canvas, 0, offsetY, canvas.width, thisSliceH, 0, 0, canvas.width, thisSliceH);
      const imgData = sliceCanvas.toDataURL('image/jpeg', 0.92);
      if (!firstSlice) pdf.addPage('a4', 'p'); else firstSlice = false;
      const imgHmm = thisSliceH / pxPerMm;
      pdf.addImage(imgData, 'JPEG', 0, 0, A4_W_MM, imgHmm);
      offsetY += thisSliceH;
    }
  }
  pdf.save('brochure.pdf');

  btn.textContent = originalText;
  btn.disabled = false;
  document.body.classList.remove('exporting');
  zoomSelect.value = prevZoom;
  zoomSelect.dispatchEvent(new Event('change'));
}

/* =========================================================
   Sidebar resize (drag handle between sidebar and preview)
   ========================================================= */
function initSidebarResize() {
  const resizer = document.getElementById('sidebarResizer');
  const sidebar = document.getElementById('sidebar');
  let startX = 0, startWidth = 0;

  function onMove(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const next = Math.min(800, Math.max(260, startWidth + (clientX - startX)));
    sidebar.style.width = next + 'px';
  }
  function onUp() {
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
  }
  function onDown(e) {
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startWidth = sidebar.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    e.preventDefault();
  }
  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown);
}

(function studioPlus() {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/s$/, '');
  const isHex6 = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
  const fixHex = v => {
    if (typeof v !== 'string') return null;
    if (isHex6(v)) return v.toLowerCase();
    const m = /^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.exec(v);
    return m ? ('#' + m[1] + m[1] + m[2] + m[2] + m[3] + m[3]).toLowerCase() : null;
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  /* ---------- toast + file helpers ---------- */
  function toast(msg, kind) {
    const wrap = $('#exToasts');
    const t = h('div', { class: 'ex-toast' + (kind === 'err' ? ' err' : '') }, msg);
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, kind === 'err' ? 6000 : 3400);
  }
  function downloadText(name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();

    zone.appendChild(input);
    zone.addEventListener('click', e => { if (e.target !== input) input.click(); });
    input.addEventListener('change', () => { if (input.files[0]) onFile(input.files[0]); input.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
    zone.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) onFile(f); });
  }
  function resolveType(v) {
    if (v == null) return null;
    const n = norm(v);
    for (const k in TYPES) if (norm(k) === n || norm(TYPES[k].label) === n) return k;
    return null;
  }
  function ensureTypo() {
    if (!state.typo || typeof state.typo !== 'object') state.typo = {};
    if (!state.typo.global) state.typo.global = {};

     TABS

  /* maps raw CSV rows onto a spec. hasHeader: true/false/null(auto) */

  /* guess which section type a CSV belongs to from its header row */
  function headerScore(spec, first) {

    specCols(spec).forEach(c => {
      const al = [c.key, c.label, ...(c.alias || [])].map(norm).filter(Boolean);

  const SKIP_FIELD = /logo|image|photo|icon|background|bgimg|^id$/i;
  function isStringArrayField(type, field, current) {
    if (!Array.isArray(current)) return false;
    if (current.some(x => typeof x !== 'string')) return false;
    let def; try { def = TYPES[type].defaultData()[field]; } catch (e) { def = null; }
    if (Array.isArray(def) && def.length && typeof def[0] !== 'string') return false;

  function exportFieldsCSV() {
    const rows = [['section', 'n', 'field', 'value']];
